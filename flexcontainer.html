<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            width: 400px;
            height: 300px;
            border-radius: 15px;
            background-color: blue;
              gap: 20px;
              text-align: center;
              margin: auto;
              justify-content: space-around;
              flex-wrap: wrap-reverse;
              
              
              
            }
          div {
            background-color: green;
            color: white;
            width: 100px;
            height: 80px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;

        }
    </style>
</head>
<body>
    <div class="container">
        <div>apple</div>
        <div>banana</div>
        <div>mango</div>
        <div>guava</div>
        <div>orange</div>
        <div>lemon</div>
        <div>pineapple</div>
        <div>lime</div>
       

    </div>
</body>
</html>
