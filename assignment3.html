<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard design</title>
    <style>
        * {box-sizing: border-box;
        } 
        body { 
            margin: 0px;
            font-family: 'Times New Roman', Times, serif;
            background-color: white;
            color: black;
        }
        *{
            height: 640px0;
            background-color: black;
            position: relative;
        }
       * {
        width: 11px;
        height: 11px;
        background-color: rgb(0, 208, 255);
        border-radius: 50%;
        position: absolute;
        top: 15px;
        right: 20%;
        padding: 8px;
        min-height: 520px;
       }
       * {
        display: flex;
        column-gap: 12px;
        margin-bottom: 10px;
       }
       .box h3 {
        font-size: 14px;
        margin-bottom: 10px;
       }
     .box {
        background-color: lightblue;
        border-radius: 6px;
        padding: 10px;
        width: 40%;
        min-height: 80px;
     }
     .box h3 {
        font-size: 14px;
        margin-bottom: 10px;
     }
     .box p {
        font-size: 10px;
     }
     table {
        width: 83%;
        border-collapse: collapse;
        font-size: 10px;
        margin-bottom: 10px;
     }
     th {
        background-color: blue;
        padding: 6px;
        border: 1px solid lightblue;
     }
     td {
        padding: 5px;
        border: 1px solid lightblue;
     }
     h2 {
        font-size: 14px;
        margin: 10px 0%;
     }
     form {
        width: 85%;
     }
     input {
        display: block;
        width: 100%;
        padding: 5px;
        margin-bottom: 5px;
        border: 1px solid black;
        border-radius: 4px;
        font-size: 9px;
     }
     button {
      background-color: green;
      color: white;
      font-size: 9px;
      border: 1px solid black;
      border-radius: 3px;
      padding: 2px 5px;
      cursor: pointer;
     }
     .bottom-section {
          height: 640px;
          background-color: black;

     }
     @media (max-width: 500px) {

     }
    .boxes {
      gap: initial;
    }
     .box {
      flex: 1;
      width: auto;
     }
     table,
     form{
      width: auto;
     }
        </style>
        
</head>
<body>
    <div class="top-section">
     <div class="dot"></div>
    </div>
     <main class="content">
         <div class="boxes">
            <div class="box">
               <h3>left box</h3>
               <p>content forleft box</p>
               
         </div>
</body>
</html>
