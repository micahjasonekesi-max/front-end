<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUSH STORE | premium fashion</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            display: flex;
            flex-direction: column;
            height: 110px;
            width: 100%;
            margin-bottom: 1px solid wheat;
        }
        .head-top {
            display: flex;
            background-color: black;
            height: 35px;
            justify-content: center;
            color: white;
            align-items: center;

        }
        .head-bot{
            background-color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
            padding-left: 80px;
            padding-right: 80px;
            box-shadow: 1px 2px 3px rgba(red, green, blue, alpha);
        }
        .left {
            display: flex;
            gap: 4px;
        }
        .luxe {
            font-size: 2.5rem;
        }
        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: orange;
            margin-top: 32px;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }
        .right {
            display: flex;
            gap: 20px;
        }
        nav a{
            text-decoration: none;
            color: black;
        }nav a:hover {
            color: blue;
        }
       .hero {
        background: linear-gradient(90deg, rgba(0, 0, 0, .78), rgba(0, 0, 0, .12)),
        url('') center/cover no-repeat;
        min-height: 600px;
        
       }
     
    </style>
</head>
<body>
   <header>
    <div class="head-top">
      FREE SHIPPING ON ORDERS ABOVE $100,000
    </div>
    <div class="head-bot">
      <div class="left">
        <div class="luxe">LUXE</div>
        <div class="dot"></div>
      </div>
      <nav>
        <a href="Home">Home</a>
        <a href="Shop">Shop</a>
        <a href="Categories">Categories</a>
        <a href="About">About</a>
      </nav>
      <div class="right">
       <div></div>
       <div></div>
       <div></div> 
      </div>
    </div>
   </header>
   <div class="hero">

   </div>
</body>
</html>
