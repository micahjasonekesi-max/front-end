<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        table {border: 1px solid black;
        width: 100%; border-collapse: collapse;}
        th,  td { border: 1px solid black; th, td;
        text-align: center;}
        tr:hover{  background-color: blue; color: white;
        }
        tr:nth-child(2n+1){background-color: brown;
        color: aquamarine;}
        

    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tables in html</h1>
    <p>table tag is used to define table in html</p>
    <p>tr is used to define table row</p>
    <p>th is used to define table head</p>
    <p>td is used to define table data</p>
    <table>
        <caption>students data</caption>
        <tr>
            <th>name</th>
            <th>Age</th>
            <th>City</th>
            <tr>
                <td>fola</td>
                <td>19</td>
                <td>ibadan</td>

            </tr>
            <tr>
                <td>david</td>\
                <td>20</td>
                <td>abuja</td>
            </tr>
            <tr>
                <td>ayo</td>
                <td>21</td>
                <td>lagos</td>
            </tr>
            <tr>
               <td>jeff</td>
               <td>18</td>
               <td>ibadan</td>
            </tr>
        </tr>
    </table>
</body>
</html>
